name: Deploy developer wiki

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-wiki.yml"
      - "docs/**"
      - "game/**"
      - "project.godot"
      - "export_presets.cfg"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-wiki.yml"
      - "docs/**"
      - "game/**"
      - "project.godot"
      - "export_presets.cfg"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  export-game:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable

      - name: Import game resources
        run: godot --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Test game contracts
        run: |
          test -s "$GITHUB_WORKSPACE/game/assets/fonts/nanum-gothic/OFL.txt"
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/basic_loop_smoke_test.gd" | tee /tmp/sfh-smoke.log
          grep -q "SMOKE_TEST_OK web_korean_font" /tmp/sfh-smoke.log

      - name: Export browser game
        run: |
          mkdir -p "$GITHUB_WORKSPACE/game-web"
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Web" "$GITHUB_WORKSPACE/game-web/index.html"
          test -s "$GITHUB_WORKSPACE/game-web/index.html"
          test -s "$GITHUB_WORKSPACE/game-web/index.wasm"
          test -s "$GITHUB_WORKSPACE/game-web/index.pck"

      - name: Upload browser game
        uses: actions/upload-artifact@v4
        with:
          name: game-web
          path: game-web
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: export-game
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install wiki dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Build wiki
        run: python -m mkdocs build --strict

      - name: Add browser game to wiki site
        uses: actions/download-artifact@v5
        with:
          name: game-web
          path: .wiki-site/play

      - name: Verify combined Pages artifact
        run: |
          test -s .wiki-site/index.html
          test -s .wiki-site/play/index.html
          test -s .wiki-site/play/index.wasm
          test -s .wiki-site/play/index.pck

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .wiki-site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
