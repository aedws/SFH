name: Deploy developer wiki

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # Persistent private runner: never execute an unreviewed contributor's PR.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner)
    runs-on: [self-hosted, Linux, X64, sfh-build]
    permissions:
      contents: write
    outputs:
      game: ${{ steps.route.outputs.game }}
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Snapshot the commit that main replaced
        if: github.event_name == 'push'
        env:
          PREVIOUS_MAIN_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PREVIOUS_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$PREVIOUS_MAIN_SHA" =~ ^0+$ ]]; then
            echo "No previous main commit to snapshot."
            exit 0
          fi
          git cat-file -e "$PREVIOUS_MAIN_SHA^{commit}"
          backup_branch="backup/pre-main/$PREVIOUS_MAIN_SHA"
          backup_ref="refs/heads/$backup_branch"
          git check-ref-format "$backup_ref"
          existing_sha=$(git ls-remote --heads origin "$backup_ref" | awk '{print $1}')
          if [ -n "$existing_sha" ]; then
            test "$existing_sha" = "$PREVIOUS_MAIN_SHA"
            echo "PRE_MAIN_BACKUP_EXISTS branch=$backup_branch commit=$PREVIOUS_MAIN_SHA"
            exit 0
          fi
          git push origin "$PREVIOUS_MAIN_SHA:$backup_ref"
          echo "PRE_MAIN_BACKUP_CREATED branch=$backup_branch commit=$PREVIOUS_MAIN_SHA"

      - name: Classify changes without GitHub artifact storage
        id: route
        env:
          SFH_SELF_HOSTED_ENABLED: ${{ vars.SFH_SELF_HOSTED_ENABLED }}
          SFH_SELF_HOSTED_READY_UNTIL: ${{ vars.SFH_SELF_HOSTED_READY_UNTIL }}
        run: python3 scripts/ci_budget.py plan

      - name: Check CI routing and wiki inputs before expensive game work
        run: |
          python3 scripts/test_ci_budget.py
          python3 scripts/test_ci_transfer.py
          python3 scripts/generate_code_module_map.py --check
          python3 scripts/generate_project_ontology.py --check

  export-game:
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.game == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
      options: --ulimit core=0
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable/. ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Install font import runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig python3 xvfb xauth libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libdbus-1-3

      - name: Import game resources
        run: |
          python3 scripts/test_balance_csv_imports.py
          set +e
          godot --headless --path "$GITHUB_WORKSPACE" --import
          import_status=$?
          set -e
          if [ "$import_status" -ne 0 ]; then
            if [ "$import_status" -ne 134 ]; then
              exit "$import_status"
            fi
            find "$GITHUB_WORKSPACE/.godot/imported" -name 'Galmuri11-Bold.ttf-*.fontdata' -size +0c | grep -q .
            find "$GITHUB_WORKSPACE/.godot/imported" -name 'NanumGothic-Regular.ttf-*.fontdata' -size +0c | grep -q .
            echo "Godot exited 134 after producing both required font imports; continuing to full game, E2E, and Web export validation."
          fi

      - name: Test game contracts
        run: |
          godot --headless --path "$GITHUB_WORKSPACE" --script res://game/tests/weapon_arsenal_contract_test.gd > /tmp/sfh-arsenal.log 2>&1
          cat /tmp/sfh-arsenal.log
          grep -q 'WEAPON_ARSENAL_OK' /tmp/sfh-arsenal.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/sfh-arsenal.log
          godot --headless --path "$GITHUB_WORKSPACE" --script res://game/tests/weapon_distance_contract_test.gd > /tmp/sfh-distance.log 2>&1
          cat /tmp/sfh-distance.log
          grep -q 'WEAPON_DISTANCE_OK' /tmp/sfh-distance.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/sfh-distance.log
          if godot --headless --path "$GITHUB_WORKSPACE" --script res://scripts/export_dps_catalog.gd -- --check > /tmp/sfh-dps-runtime.log 2>&1; then
            cat /tmp/sfh-dps-runtime.log
          else
            cat /tmp/sfh-dps-runtime.log
            exit 1
          fi
          cat /tmp/sfh-dps-runtime.log
          grep -q "DPS_CATALOG_OK" /tmp/sfh-dps-runtime.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-dps-runtime.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/partial_completion_contract_test.gd" > /tmp/sfh-partial-completion.log 2>&1
          cat /tmp/sfh-partial-completion.log
          grep -q "PARTIAL_COMPLETION_OK" /tmp/sfh-partial-completion.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-partial-completion.log
          if godot --headless --path "$GITHUB_WORKSPACE" --script res://game/tests/fun_qa_affordance_test.gd > /tmp/sfh-fun-qa.log 2>&1; then
            cat /tmp/sfh-fun-qa.log
          else
            cat /tmp/sfh-fun-qa.log
            exit 1
          fi
          grep -q "FUN_QA_AFFORDANCE_OK" /tmp/sfh-fun-qa.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-fun-qa.log
          if godot --headless --path "$GITHUB_WORKSPACE" --script res://game/tests/weapon_attachment_rack_test.gd > /tmp/sfh-attachments.log 2>&1; then
            cat /tmp/sfh-attachments.log
          else
            cat /tmp/sfh-attachments.log
            exit 1
          fi
          grep -q "WEAPON_ATTACHMENT_RACK_OK" /tmp/sfh-attachments.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-attachments.log
          godot --headless --path "$GITHUB_WORKSPACE" --script res://game/tests/module_socket_workspace_test.gd > /tmp/sfh-module-sockets.log 2>&1
          cat /tmp/sfh-module-sockets.log
          grep -q "MODULE_SOCKET_WORKSPACE_OK" /tmp/sfh-module-sockets.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-module-sockets.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/provisional_policy_contract_test.gd" > /tmp/sfh-provisional-policy.log 2>&1
          cat /tmp/sfh-provisional-policy.log
          grep -q "PROVISIONAL_POLICY_OK" /tmp/sfh-provisional-policy.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-provisional-policy.log
          test -s "$GITHUB_WORKSPACE/game/assets/fonts/nanum-gothic/OFL.txt"
          test -s "$GITHUB_WORKSPACE/game/assets/fonts/galmuri/OFL.txt"
          test -s "$GITHUB_WORKSPACE/game/assets/fonts/galmuri/Galmuri11-Bold.ttf"
          test -s "$GITHUB_WORKSPACE/game/assets/vfx/kenney_particle_pack/LICENSE.txt"
          test -s "$GITHUB_WORKSPACE/game/assets/vfx/kenney_particle_pack/SOURCE.md"
          grep -q "Creative Commons Zero" "$GITHUB_WORKSPACE/game/assets/vfx/kenney_particle_pack/LICENSE.txt"
          python3 scripts/sync_item_lifecycle.py --check
          python3 scripts/sync_loot_table.py --check
          python3 scripts/sync_season_rewards.py --check
          python3 scripts/sync_facilities.py --check
          python3 scripts/sync_skill_catalog.py --check
          python3 scripts/sync_session_socket_rules.py --check
          python3 scripts/sync_character_catalog.py --check
          python3 scripts/sync_loadout_investment.py --check
          python3 scripts/sync_p5_catalogs.py --check
          python3 scripts/check_p5_modularity.py
          python3 scripts/check_system_modularity.py
          python3 scripts/check_game_ui_audit.py
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/frame_feedback_contract_test.gd" 2>&1 | tee /tmp/sfh-frame-feedback.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/combat_fx_contract_test.gd" 2>&1 | tee /tmp/sfh-combat-fx.log
          grep -q 'COMBAT_FX_OK' /tmp/sfh-combat-fx.log
          ! grep -Eq 'SCRIPT ERROR:|^ERROR:' /tmp/sfh-combat-fx.log
          grep -q "FRAME_FEEDBACK_OK" /tmp/sfh-frame-feedback.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-frame-feedback.log
          timeout 90 xvfb-run -a godot --path "$GITHUB_WORKSPACE" --audio-driver Dummy --script "res://game/tests/floor_render_contract_test.gd" 2>&1 | tee /tmp/sfh-floor-render.log
          grep -q "FLOOR_RENDER_OK" /tmp/sfh-floor-render.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-floor-render.log
          timeout 90s xvfb-run -a godot --path "$GITHUB_WORKSPACE" --audio-driver Dummy --script "res://game/tests/roguelike_fog_contract_test.gd" 2>&1 | tee /tmp/sfh-roguelike-fog.log
          grep -q "ROGUELIKE_FOG_OK" /tmp/sfh-roguelike-fog.log
          grep -q "ROGUELIKE_FOG_PIXELS_OK" /tmp/sfh-roguelike-fog.log
          grep -q "SPACE_FOG_PIXELS_OK" /tmp/sfh-roguelike-fog.log
          ! grep -E 'SCRIPT ERROR:|^ERROR:' /tmp/sfh-roguelike-fog.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/player_facing_ui_contract_test.gd" 2>&1 | tee /tmp/sfh-player-ui.log
          grep -q "PLAYER_FACING_UI_OK" /tmp/sfh-player-ui.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-player-ui.log
          timeout 60s xvfb-run -a godot --path "$GITHUB_WORKSPACE" --audio-driver Dummy --script "res://game/tests/inventory_presentation_contract_test.gd" 2>&1 | tee /tmp/sfh-inventory-ui.log
          grep -q "INVENTORY_PRESENTATION_OK" /tmp/sfh-inventory-ui.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-inventory-ui.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/smart_targeting_center_contract_test.gd" 2>&1 | tee /tmp/sfh-targeting-center.log
          grep -q "SMART_TARGETING_CENTER_OK" /tmp/sfh-targeting-center.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-targeting-center.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/circular_coverage_contract_test.gd" 2>&1 | tee /tmp/sfh-circular-coverage.log
          grep -q "CIRCULAR_COVERAGE_OK" /tmp/sfh-circular-coverage.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-circular-coverage.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/loot_table_contract_test.gd" | tee /tmp/sfh-loot-table.log
          grep -q "LOOT_TABLE_TEST_OK rows_101 regions_3 deterministic_rolls difficulty_grade_bias player_briefing lifecycle_link weapon_definition_link" /tmp/sfh-loot-table.log
          grep -q "arsenal_sources_216" /tmp/sfh-loot-table.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/field_loot_acquisition_contract_test.gd" | tee /tmp/sfh-field-loot.log
          grep -q "FIELD_LOOT_ACQUISITION_OK spawn approach compare lifecycle cancel retain reacquire select run_storage immediate_equip skill_swap_slot_binding_restore provisional_policy restore_on_hub viewport_safe modular_boundary" /tmp/sfh-field-loot.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/operation_combination_contract_test.gd" | tee /tmp/sfh-operation-combinations.log
          grep -q "OPERATION_COMBINATION_OK combinations_81 tiers_3 difficulties_3 regions_3 characters_3 setting_changes_12 weapon_module_part_utility_penalty preflight_plan launch_assemble_esc_return entry_routes_4 wizard_steps_3 tutorial_steps_4 tutorial_optional settlement_optional_repeat" /tmp/sfh-operation-combinations.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/operation_launch_preflight_contract_test.gd" | tee /tmp/sfh-operation-preflight.log
          grep -q "OPERATION_PREFLIGHT_OK generic_contributors immutable_plan no_debit_before_validation validator_rejection equipment_module_part_revalidation inventory_overlap_rejection future_setting_extension free_loot_contract" /tmp/sfh-operation-preflight.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/character_selection_contract_test.gd" | tee /tmp/sfh-character-selection.log
          grep -q "CHARACTER_SELECTION_OK characters_3 optional_module locked_live_csv briefing_quote passive_runtime entry_cost_once" /tmp/sfh-character-selection.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/loadout_investment_contract_test.gd" | tee /tmp/sfh-loadout-investment.log
          grep -q "LOADOUT_INVESTMENT_E2E_OK owned_locked_run_purchase skill_price_once equipped_weapon_preserved tag_gate hub_module_part_preserved same_weapon_customization no_catalog_override preflight modular_boundary" /tmp/sfh-loadout-investment.log
          grep -q "remapped_launch physical_skill_input runtime_settings nested_swap_restore save_failure_atomic future_definition" /tmp/sfh-loadout-investment.log
          grep -q "weapon_sources_54" /tmp/sfh-loot-table.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/hub_preparation_contract_test.gd" | tee /tmp/sfh-hub-preparation.log
          grep -q "HUB_PREPARATION_OK" /tmp/sfh-hub-preparation.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/mobile_hud_elite_contract_test.gd" | tee /tmp/sfh-mobile-hud-elite.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/mobile_control_entry_contract_test.gd" 2>&1 | tee /tmp/sfh-mobile-control-entry.log
          grep -q "MOBILE_CONTROL_ENTRY_OK" /tmp/sfh-mobile-control-entry.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-mobile-control-entry.log
          grep -q "PURSUIT_BOSS_OK half_cost rounded_free_entry failed_spawn_retry locked_door_damage reclosed_door_damage boss_kill_once no_respawn" /tmp/sfh-mobile-hud-elite.log
          grep -q "MOBILE_HUD_ELITE_OK optional_modules dependencies hud_bottom_left movable_anchor key_format mobile_semantic_pad threshold_entry_cost random_elite faster_stronger infinite_room_independent" /tmp/sfh-mobile-hud-elite.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/boss_warning_contract_test.gd" | tee /tmp/sfh-boss-warning.log
          grep -q "BOSS_WARNING_OK" /tmp/sfh-boss-warning.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/run_settlement_contract_test.gd" | tee /tmp/sfh-run-settlement.log
          grep -q "RUN_SETTLEMENT_OK auto_convert_450 permanent_unlock warehouse run_only_expiry death_loss idempotent_run_id" /tmp/sfh-run-settlement.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/p5_hub_progression_contract_test.gd" | tee /tmp/sfh-p5.log
          grep -q "P5_HUB_PROGRESSION_OK web_payload_fallback_6 utility_draft_atomic bankruptcy_repeat shop_quality_rotation_no_double_debit run_return_rotation_cancel_guard workshop_blueprint_registry_provider_unlock_persistence_affix_socket training_telemetry_restore codex_progress_hint_persistence optional_submodules shop_transaction_persistence schema_rejection workshop_transaction_atomic" /tmp/sfh-p5.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/shop_browser_contract_test.gd" | tee /tmp/sfh-p7-shop.log
          grep -q "P7_SHOP_BROWSER_OK" /tmp/sfh-p7-shop.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/shop_quality_inventory_contract_test.gd" | tee /tmp/sfh-p7-shop-quality.log
          grep -q "P7_SHOP_QUALITY_OK quote delivery_instance option_socket inventory_equipment_roundtrip actual_stat_1_25 catalog_replaceable rollback_consistency" /tmp/sfh-p7-shop-quality.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/shop_delivery_modularity_contract_test.gd" | tee /tmp/sfh-p7-shop-delivery-module.log
          grep -q "P7_SHOP_DELIVERY_MODULE_OK p5_on delivery_off legacy_warehouse bag_unchanged manifest_dependency" /tmp/sfh-p7-shop-delivery-module.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/workshop_blueprint_registry_contract_test.gd" | tee /tmp/sfh-p7-blueprint.log
          grep -q "P7_BLUEPRINT_REGISTRY_OK extraction permanent_registration unknown_guard idempotent reconnect recipe_candidates facade_status" /tmp/sfh-p7-blueprint.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/workshop_craft_transaction_contract_test.gd" | tee /tmp/sfh-p7-workshop.log
          grep -q "P7_WORKSHOP_TRANSACTION_OK quote_no_mutation visible_cost_material_roll atomic_single_commit duplicate_guard invalid_no_mutation actual_affixes_sockets reconnect replaceable_policy provider_failure storage_failure_rollback" /tmp/sfh-p7-workshop.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/training_ground_scenario_contract_test.gd" | tee /tmp/sfh-p8-training-contract.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/training_loadout_restore_contract_test.gd" 2>&1 | tee /tmp/sfh-training-restore.log
          grep -q "TRAINING_LOADOUT_RESTORE_OK" /tmp/sfh-training-restore.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-training-restore.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/training_optional_matrix_test.gd" 2>&1 | tee /tmp/sfh-training-optional.log
          grep -q "TRAINING_OPTIONAL_MATRIX_OK" /tmp/sfh-training-optional.log
          ! grep -E "SCRIPT ERROR:|^ERROR:" /tmp/sfh-training-optional.log
          grep -q "P8_TRAINING_GROUND_OK scenario_resource single_boss dense_8 no_overlap smart_targeting reset_service auto_reset telemetry_window final_snapshot reset_restarts_telemetry ap_rate cooldown_cycle spawn_budget_isolated optional_module" /tmp/sfh-p8-training-contract.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/ranking_provider_contract_test.gd" | tee /tmp/sfh-p6-ranking.log
          grep -q "P6_RANKING_SUBMISSION_OK identity envelope_digest idempotency local_preserved persistent_retry timeout_retry server_rejection visible_sync_state" /tmp/sfh-p6-ranking.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/ranking_season_contract_test.gd" | tee /tmp/sfh-p6-season.log
          grep -q "P6_SEASON_OK boss_identity defeat_once legacy_zero digest_v1_v2 slayer_tiebreak frozen_launch_context eligibility deadline_crossing lifetime_preserved offline_close immutable_archive restart clock_rollback optional_module" /tmp/sfh-p6-season.log
          grep -q "shipped_policy_81 legacy_policy_rollover" /tmp/sfh-p6-season.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/season_reward_contract_test.gd" | tee /tmp/sfh-p6-rewards.log
          grep -q "P6_REWARD_OK" /tmp/sfh-p6-rewards.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/basic_loop_smoke_test.gd" | tee /tmp/sfh-smoke.log
          grep -q "SMOKE_TEST_OK hit_feedback hit_reaction local_stagger knockback impact_burst camera_trauma hit_feedback_optional impact_budget module_reference_ui module_effect_summary module_card_metadata module_sort_controls operation_briefing" /tmp/sfh-smoke.log
          grep -q "WEAPON_PARTS_UI_OK code_weapon_schematic socket_map installed_state socket_interaction" /tmp/sfh-smoke.log
          grep -q "CYBERPUNK_THEME_OK accent_02e5e1 pixel_korean scanlines static_noise blink_state optional_overlay" /tmp/sfh-smoke.log
          grep -q "MOVEMENT_FEEDBACK_OK launch_punch camera_lead turn_brake_cues dash_trail optional_module" /tmp/sfh-smoke.log
          grep -q "RUN_AUGMENT_UI_OK cards_3 category_title_effect_stack keyboard_selection optional_presenter" /tmp/sfh-smoke.log
          grep -q "LOOT_LIFECYCLE_OK items_15 families_2 session_convertible_3 policy_validation presenter" /tmp/sfh-smoke.log
          grep -q "SESSION_SOCKET_OK runasset_csv rune_2 core_1 artifact_1 duplicate_limit runtime_effects hud_unsocket run_clear optional_module" /tmp/sfh-smoke.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/equipment_fixed_identity_contract_test.gd" | tee /tmp/sfh-fixed-identity.log
          grep -q "EQUIPMENT_FIXED_IDENTITY_OK locked_csv weapon_options armor_options assigned_affix persistence same_weapon_same_skill run_level_invariant meta_level_invariant module_source_separate fixed_skill_damage electric_area_on_confirmed_hit radius_filter target_budget impact_profile" /tmp/sfh-fixed-identity.log
          python3 scripts/sync_equipment_identity.py --check

      - name: Verify native progress across separate processes
        run: |
          save_root=$(mktemp -d /tmp/sfh-desktop-progress.XXXXXX)
          for phase in write read; do
            timeout 90 godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/desktop_progress_contract_test.gd" -- --save-root="$save_root" --phase="$phase" > "/tmp/sfh-save-$phase.log" 2>&1
            cat "/tmp/sfh-save-$phase.log"
            grep -q "DESKTOP_PROGRESS_OK phase=$phase" "/tmp/sfh-save-$phase.log"
            if grep -Eq 'SCRIPT ERROR|DESKTOP_PROGRESS_FAILED' "/tmp/sfh-save-$phase.log"; then exit 1; fi
          done

      - name: Export browser game
        run: |
          mkdir -p "$GITHUB_WORKSPACE/game-web"
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Web" "$GITHUB_WORKSPACE/game-web/index.html"
          test -s "$GITHUB_WORKSPACE/game-web/index.html"
          test -s "$GITHUB_WORKSPACE/game-web/index.wasm"
          test -s "$GITHUB_WORKSPACE/game-web/index.pck"

      - name: Verify exported resource boot (not editor source)
        run: |
          status=0
          timeout 90 godot --headless --main-pack "$GITHUB_WORKSPACE/game-web/index.pck" --script res://game/tests/release_boot_contract_test.gd > /tmp/sfh-release-boot.log 2>&1 || status=$?
          cat /tmp/sfh-release-boot.log
          test "$status" -eq 0
          grep -q 'RELEASE_BOOT_OK' /tmp/sfh-release-boot.log
          if grep -Eq 'SCRIPT ERROR|ERROR:' /tmp/sfh-release-boot.log; then exit 1; fi

      - name: Verify rendered player visibility under slow frames
        run: |
          status=0
          timeout 90 xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --max-fps 5 --main-pack "$GITHUB_WORKSPACE/game-web/index.pck" --script res://game/tests/release_boot_contract_test.gd > /tmp/sfh-release-view.log 2>&1 || status=$?
          cat /tmp/sfh-release-view.log
          test "$status" -eq 0
          grep -q 'RELEASE_BOOT_OK' /tmp/sfh-release-view.log
          grep -q 'RELEASE_PIXELS cyan=' /tmp/sfh-release-view.log
          if grep -Eq 'SCRIPT ERROR|ERROR:' /tmp/sfh-release-view.log; then exit 1; fi

      - name: Record source tree and payload hashes
        run: python3 scripts/ci_budget.py attest --directory game-web

      - name: Hand off verified browser game on private runner
        run: python3 scripts/ci_transfer.py publish --surface game-web --directory game-web

      - name: Return container files to the private runner owner
        if: always()
        run: |
          owner=$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          if [ -d "$GITHUB_WORKSPACE/../.sfh-build-store" ]; then
            chown -R "$owner" "$GITHUB_WORKSPACE/../.sfh-build-store"
          fi

  e2e:
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.game == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
      options: --ulimit core=0
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable/. ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Install font import runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig python3

      - name: Import game resources
        run: |
          python3 scripts/test_balance_csv_imports.py
          set +e
          godot --headless --path "$GITHUB_WORKSPACE" --import
          import_status=$?
          set -e
          if [ "$import_status" -ne 0 ]; then
            if [ "$import_status" -ne 134 ]; then
              exit "$import_status"
            fi
            find "$GITHUB_WORKSPACE/.godot/imported" -name 'Galmuri11-Bold.ttf-*.fontdata' -size +0c | grep -q .
            find "$GITHUB_WORKSPACE/.godot/imported" -name 'NanumGothic-Regular.ttf-*.fontdata' -size +0c | grep -q .
          fi

      - name: Test real-input play session
        run: |
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/training_ground_gameplay_e2e_test.gd" | tee /tmp/sfh-p8-training-e2e.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/game_ui_rematch_test.gd" 2>&1 | tee /tmp/sfh-ui-rematch.log
          grep -q "GAME_UI_REMATCH_OK" /tmp/sfh-ui-rematch.log
          if grep -Eq 'SCRIPT ERROR|ERROR:' /tmp/sfh-ui-rematch.log; then exit 1; fi
          godot --headless --path "$GITHUB_WORKSPACE" res://game/tests/game_ui_review.tscn 2>&1 | tee /tmp/sfh-ui-gallery.log
          test "$(grep -c 'UI_REVIEW_FRAME ' /tmp/sfh-ui-gallery.log)" = 29
          if grep -Eq 'SCRIPT ERROR|ERROR:' /tmp/sfh-ui-gallery.log; then exit 1; fi
          grep -q "E2E_P8_TRAINING_GROUND_OK hub_station interaction single_attack_telemetry telemetry_hud viewport_safe no_overlap compact_skill_hud scenario_readable ap_rate cooldown_cycle isolated_skill_runtime free_loadout_restore dense_switch spawn_isolation hub_exit_cleanup" /tmp/sfh-p8-training-e2e.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/extraction_district_contract_test.gd" 2>&1 | tee /tmp/sfh-district.log
          grep -q 'EXTRACTION_DISTRICT_OK' /tmp/sfh-district.log
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/regional_map_contract_test.gd" 2>&1 | tee /tmp/sfh-regional-map.log
          grep -q 'REGIONAL_MAP_OK' /tmp/sfh-regional-map.log
          if grep -Eq 'SCRIPT ERROR|ERROR:' /tmp/sfh-regional-map.log; then exit 1; fi
          if grep -Eq 'SCRIPT ERROR|ERROR:' /tmp/sfh-district.log; then exit 1; fi
          godot --headless --path "$GITHUB_WORKSPACE" --script "res://game/tests/e2e_play_session_test.gd" | tee /tmp/sfh-e2e.log
          grep -q "E2E_PLAY_SESSION_OK" /tmp/sfh-e2e.log
          grep -q "E2E_LOOT_SESSION_OK" /tmp/sfh-e2e.log
          grep -q "E2E_BOSS_WARNING_OK" /tmp/sfh-e2e.log
          grep -q "E2E_LOOT_DEATH_OK" /tmp/sfh-e2e.log
          grep -q "E2E_SEASON_PLAYER_OK briefing_eligibility actual_history_click readonly_history launch_context result_bosses small_ineligible_lifetime_preserved" /tmp/sfh-e2e.log
          grep -q "E2E_HUB_LOADOUT_OK transitions_6 focused_controls repeated_open pause_restored live_edit_draft_refresh save_discard_cancel modules_parts" /tmp/sfh-e2e.log
          grep -q "ui_state_contracts_23 player_perception_contracts_33 gameplay_flows_15" /tmp/sfh-e2e.log
          grep -q "physical_lmb_attack hit_kill_drop room_entry_lock_clear_credit_boxes elite_credit_threshold_pursuit early_extraction minimap_expanded_warp medium_large_600s fog_room_corridor_transition fog_three_states_omnidirectional fog_wall_occlusion fog_exploration_memory" /tmp/sfh-e2e.log
          grep -q "key_mapping_k_esc mobile_keypad_settings movable_player_status key_label_format" /tmp/sfh-e2e.log
          grep -q "loot_table_targeting" /tmp/sfh-e2e.log
          grep -q "field_loot_compare_cancel_select" /tmp/sfh-e2e.log
          grep -q "field_loot_immediate_equip_r_restore" /tmp/sfh-e2e.log
          grep -q "field_loot_skill_swap_r_restore" /tmp/sfh-e2e.log
          grep -q "operation_combinations_9" /tmp/sfh-e2e.log
          grep -q "responsive_operation_briefing_widths_4" /tmp/sfh-e2e.log
          grep -q "E2E_TUTORIAL_LAYOUT_OK viewports_4 steps_16 visible_panel_bounds remapped_hints" /tmp/sfh-e2e.log
          grep -q "E2E_INVENTORY_EDITOR_OK draft_atomic move_overlap_bounds select_r_rotate_persist_collision_bounds equip_tags modules_unequip full_bag conflict_guard save_discard_cancel viewports_4 tabs_3" /tmp/sfh-e2e.log
          grep -q "E2E_TUTORIAL_VISIBLE_OK live_clicks movement_passthrough mission_restore central_safe" /tmp/sfh-e2e.log
          grep -q "session_socket_hidden_when_empty tactical_hud mission_tracker bottom_combat_cluster horizontal_skill_edge_cluster central_combat_safe_zone" /tmp/sfh-e2e.log
          grep -q "run_loot_success_duplicate_guard" /tmp/sfh-e2e.log
          grep -q "run_loot_death_loss" /tmp/sfh-e2e.log
          grep -q "E2E_WEAPON_PARTS_UI_OK weapon_schematic socket_map viewport_safe" /tmp/sfh-e2e.log
          grep -q "E2E_CYBERPUNK_THEME_OK viewport_safe input_passthrough accent_02e5e1" /tmp/sfh-e2e.log
          grep -q "E2E_PLAYER_PERCEPTION_OK checkpoints_33 units_9" /tmp/sfh-e2e.log

      - name: Return container files to the private runner owner
        if: always()
        run: |
          owner=$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          if [ -d "$GITHUB_WORKSPACE/../.sfh-build-store" ]; then
            chown -R "$owner" "$GITHUB_WORKSPACE/../.sfh-build-store"
          fi

  package-windows:
    permissions:
      contents: read
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.game == 'true' && needs.export-game.result == 'success' && needs.e2e.result == 'success' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 15
    outputs:
      release-version: ${{ steps.release.outputs.version }}
    needs:
      - plan
      - export-game
      - e2e
    container:
      image: barichello/godot-ci:4.7.2
      options: --ulimit core=0
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -a /root/.local/share/godot/export_templates/4.7.2.stable/. ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Install packaging runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig python3

      - name: Import game resources
        run: |
          python3 scripts/test_balance_csv_imports.py
          set +e
          godot --headless --path "$GITHUB_WORKSPACE" --import
          import_status=$?
          set -e
          if [ "$import_status" -ne 0 ]; then
            if [ "$import_status" -ne 134 ]; then
              exit "$import_status"
            fi
            find "$GITHUB_WORKSPACE/.godot/imported" -name 'Galmuri11-Bold.ttf-*.fontdata' -size +0c | grep -q .
            find "$GITHUB_WORKSPACE/.godot/imported" -name 'NanumGothic-Regular.ttf-*.fontdata' -size +0c | grep -q .
          fi

      - name: Export Windows Desktop x86_64
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Windows Desktop x86_64" "$GITHUB_WORKSPACE/build/windows/SFH.exe"
          test -s "$GITHUB_WORKSPACE/build/windows/SFH.exe"
          test -s "$GITHUB_WORKSPACE/build/windows/SFH.pck"

      - name: Verify Windows exported resource boot
        run: |
          status=0
          timeout 90 godot --headless --main-pack "$GITHUB_WORKSPACE/build/windows/SFH.pck" --script res://game/tests/release_boot_contract_test.gd > /tmp/sfh-windows-boot.log 2>&1 || status=$?
          cat /tmp/sfh-windows-boot.log
          test "$status" -eq 0
          grep -q 'RELEASE_BOOT_OK' /tmp/sfh-windows-boot.log
          if grep -Eq 'SCRIPT ERROR|ERROR:' /tmp/sfh-windows-boot.log; then exit 1; fi

      - name: Include redistributable license records
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/windows/licenses"
          cp "$GITHUB_WORKSPACE/game/assets/fonts/nanum-gothic/OFL.txt" "$GITHUB_WORKSPACE/build/windows/licenses/NanumGothic-OFL.txt"
          cp "$GITHUB_WORKSPACE/game/assets/fonts/galmuri/OFL.txt" "$GITHUB_WORKSPACE/build/windows/licenses/Galmuri-OFL.txt"
          cp "$GITHUB_WORKSPACE/game/assets/vfx/kenney_particle_pack/LICENSE.txt" "$GITHUB_WORKSPACE/build/windows/licenses/Kenney-Particle-Pack-LICENSE.txt"

      - name: Read release version
        id: release
        run: echo "version=$(cat .release-version)" >> "$GITHUB_OUTPUT"

      - name: Package and verify Windows release
        run: |
          python3 scripts/package_release.py \
            --input-dir build/windows \
            --output-dir dist \
            --version-file .release-version \
            --godot-version-file .godot-version \
            --csv-version-file game/features/balance_data/data_version.txt \
            --csv game/features/map_generation/data/facility.csv \
            --csv game/features/weapon_balance/data/weapon_balance.csv \
            --csv game/features/growth_balance/data/run_buff_balance.csv \
            --csv game/features/growth_balance/data/upgrade_balance.csv \
            --csv game/features/loot_lifecycle/data/item_lifecycle.csv \
            --csv game/features/loot_tables/data/loot_table.csv \
            --csv game/features/conditional_ranking/data/season_reward.csv \
            --csv game/features/combat_skills/data/skill_catalog.csv \
            --csv game/features/session_sockets/data/session_socket_rules.csv \
            --csv game/features/character_selection/data/character_catalog.csv \
            --commit "$GITHUB_SHA"

      - name: Hand off verified Windows release on private runner
        run: python3 scripts/ci_transfer.py publish --surface windows --directory dist

      - name: Return container files to the private runner owner
        if: always()
        run: |
          owner=$(stat -c '%u:%g' "$GITHUB_WORKSPACE/..")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          if [ -d "$GITHUB_WORKSPACE/../.sfh-build-store" ]; then
            chown -R "$owner" "$GITHUB_WORKSPACE/../.sfh-build-store"
          fi

  build:
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, sfh-build]
    needs:
      - plan
      - export-game
      - e2e
      - package-windows
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require successful relevant checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_budget.py gate

      - name: Set up Python
        run: |
          python3 -m venv "$RUNNER_TEMP/wiki-python"
          echo "$RUNNER_TEMP/wiki-python/bin" >> "$GITHUB_PATH"

      - name: Install wiki dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Test Cloudflare release gateway
        run: |
          node scripts/test_dps_catalog.mjs
          node scripts/test_dps_engine.mjs
          node scripts/test_dps_loadout.mjs
          node scripts/test_weapon_distance.mjs
          node scripts/test_growth_engine.mjs
          python scripts/test_weapon_distance.py
          node scripts/test_map_model.cjs
          python scripts/build_balance_catalog.py --check
          python scripts/build_effect_toolkit.py --check
          node scripts/test_effect_toolkit.mjs
          node scripts/test_balance_workbench.mjs
          node scripts/test_mobile_orientation_policy.mjs
          node scripts/test_cloudflare_worker.mjs
          node scripts/test_wiki_auth_seed.mjs
          node scripts/test_wiki_auth_worker.mjs
          python -m py_compile scripts/deploy_cloudflare_assets.py
          python -m py_compile scripts/prune_windows_releases.py
          python scripts/test_windows_release_retention.py
          python scripts/test_cloudflare_release.py

      - name: Build wiki
        shell: pwsh
        run: |
          ./scripts/check-backup-workflows.ps1
          ./scripts/check-deployment-boundaries.ps1
          ./scripts/check-game-domain-cutover.ps1
          ./scripts/check-wiki-knowledge-map.ps1
          ./scripts/compress-wiki-release-days.ps1 -Check
          ./scripts/check-wiki-color-contrast.ps1
          ./scripts/check-wiki-responsive.ps1
          ./scripts/check-wiki-play-entry.ps1
          ./scripts/check-wiki-no-github-backlinks.ps1
          ./scripts/check-wiki-planner-requests.ps1
          ./scripts/check-wiki-role-auth.ps1
          ./scripts/check-p7-roadmap.ps1
          python scripts/snapshot_notion_source.py --check
          if ($LASTEXITCODE -ne 0) { throw "Notion GDD snapshot failed." }
          python scripts/snapshot_notion_tracker.py
          if ($LASTEXITCODE -ne 0) { throw "Notion tracker snapshot failed." }
          python scripts/check_notion_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Notion/code crosswalk failed." }
          python scripts/test_notion_snapshot.py
          if ($LASTEXITCODE -ne 0) { throw "Notion source and audit regressions failed." }
          ./scripts/check-code-module-map.ps1
          ./scripts/check-project-ontology.ps1
          python -m mkdocs build --strict
          python scripts/test_wiki_articles.py .wiki-site
          python scripts/prepare_wiki_worker.py
          python scripts/check_wiki_search_index.py .wiki-site/search/search_index.json
          ./scripts/check-wiki-no-github-backlinks.ps1 -SiteRoot .wiki-site
          ./scripts/check-wiki-planner-requests.ps1 -SiteRoot .wiki-site
          ./scripts/check-wiki-role-auth.ps1 -SiteRoot .wiki-site

      - name: Verify documentation-only Pages artifact
        run: |
          test -s .wiki-site/index.html
          test -s .wiki-site/assets/fonts/galmuri/Galmuri11.woff2
          test -s .wiki-site/assets/fonts/galmuri/OFL.txt
          test -s .wiki-site/javascripts/play-entry.js
          test -s .wiki-site/javascripts/knowledge-map.js
          test -s .wiki-site/assets/knowledge-map.json
          test -s .wiki-site/assets/project-ontology.json
          test -s .wiki-site/javascripts/owner-decision-console.js
          grep -q '#02e5e1' .wiki-site/stylesheets/extra.css
          grep -q 'Galmuri11.woff2' .wiki-site/stylesheets/extra.css
          grep -q 'href="https://sfh-game.vstock-market.workers.dev/"' .wiki-site/index.html
          grep -q 'data-sfh-surface="gameplay"' .wiki-site/index.html
          grep -q 'data-sfh-global-play' .wiki-site/javascripts/play-entry.js
          grep -q 'data-sfh-knowledge-map' .wiki-site/javascripts/knowledge-map.js
          grep -q 'data-sfh-owner-decision-console' .wiki-site/javascripts/owner-decision-console.js
          test -s .wiki-site/assets/deployment-surfaces.json
          test -s .wiki-site/_worker.js
          test -s .wiki-site/access/login/index.html
          test -s .wiki-site/access/account/index.html
          test -s .wiki-site/access/planner/index.html
          test -s .wiki-site/access/developer/index.html
          test ! -e .wiki-site/play/index.wasm
          test ! -e .wiki-site/play/index.pck

      - name: Hand off verified wiki on private runner
        run: python3 scripts/ci_transfer.py publish --surface wiki-site --directory .wiki-site

  cloudflare-deploy:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, sfh-build]
    permissions:
      contents: write
    needs:
      - plan
      - build
      - package-windows
    outputs:
      deployed: ${{ steps.cloudflare_config.outputs.ready }}
      release-version: ${{ needs.package-windows.outputs.release-version }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WIKI_URL: https://sfh-dev-wiki.pages.dev
      CLOUDFLARE_GAME_URL: https://sfh-game.vstock-market.workers.dev
      CLOUDFLARE_GAME_DESIRED_URL: https://sfh-game.play-preview.dev
      CLOUDFLARE_R2_BUCKET: sfh-game-artifacts
      CLOUDFLARE_WIKI_AUTH_BUCKET: sfh-wiki-auth
      SFH_WIKI_AUTH_PEPPER: ${{ secrets.SFH_WIKI_AUTH_PEPPER }}
      WIKI_AUTH_BOOTSTRAP_REVISION: "3"
      R2_RUNTIME_PREFIX: game/releases
      R2_DOWNLOAD_PREFIX: downloads
      GAME_CHANGED: ${{ needs.plan.outputs.game }}
      GAME_BUILD_COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ needs.package-windows.outputs.release-version }}
      WRANGLER_VERSION: 4.127.1
    steps:
      - name: Detect Cloudflare deployment credentials
        id: cloudflare_config
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] \
            && [ -n "$CLOUDFLARE_API_TOKEN" ] \
            && [ -n "$SFH_WIKI_AUTH_PEPPER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; keeping the verified manual deployment unchanged."
          fi

      - name: Check out repository
        if: steps.cloudflare_config.outputs.ready == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Retrieve and verify wiki from this run
        if: steps.cloudflare_config.outputs.ready == 'true'
        run: python3 scripts/ci_transfer.py retrieve --surface wiki-site --directory .cloudflare-wiki

      - name: Retrieve and verify browser game from this run
        if: steps.cloudflare_config.outputs.ready == 'true' && needs.plan.outputs.game == 'true'
        run: python3 scripts/ci_transfer.py retrieve --surface game-web --directory .cloudflare-game

      - name: Retrieve and verify Windows release from this run
        if: steps.cloudflare_config.outputs.ready == 'true' && needs.plan.outputs.game == 'true'
        run: python3 scripts/ci_transfer.py retrieve --surface windows --directory .cloudflare-windows

      - name: Verify Web provenance or preserve active game release
        if: steps.cloudflare_config.outputs.ready == 'true'
        run: |
          if [ "$GAME_CHANGED" = "true" ]; then
            python3 scripts/ci_budget.py verify --directory .cloudflare-game --run-id "$GITHUB_RUN_ID"
          else
            curl --silent --show-error --fail "$CLOUDFLARE_GAME_URL/healthz" -o /tmp/active-game.json
            python3 -c 'import json, os, re; d=json.load(open("/tmp/active-game.json")); assert re.fullmatch("[0-9a-f]{40}", d["build_commit"]); assert re.fullmatch("[A-Za-z0-9._-]+", d["release_version"]); f=open(os.environ["GITHUB_ENV"], "a"); f.write("GAME_BUILD_COMMIT="+d["build_commit"]+"\nRELEASE_VERSION="+d["release_version"]+"\n")'
          fi

      - name: Install pinned Wrangler
        if: steps.cloudflare_config.outputs.ready == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/sfh-wrangler" "wrangler@${WRANGLER_VERSION}"
          echo "$RUNNER_TEMP/sfh-wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Capture active game rollback identity
        if: steps.cloudflare_config.outputs.ready == 'true' && needs.plan.outputs.game == 'true'
        run: |
          curl --silent --show-error --fail "$CLOUDFLARE_GAME_URL/healthz" -o "$RUNNER_TEMP/sfh-previous-release.json"
          python3 scripts/release_state.py "$RUNNER_TEMP/sfh-previous-release.json"

      - name: Upload immutable R2 release objects
        if: steps.cloudflare_config.outputs.ready == 'true' && needs.plan.outputs.game == 'true'
        run: |
          python3 scripts/deploy_cloudflare_assets.py \
            --bucket "$CLOUDFLARE_R2_BUCKET" \
            --runtime-prefix "$R2_RUNTIME_PREFIX" \
            --download-prefix "$R2_DOWNLOAD_PREFIX" \
            --game-dir .cloudflare-game \
            --windows-dir .cloudflare-windows \
            --version "$RELEASE_VERSION" \
            --commit "$GITHUB_SHA" \
            --manifest .cloudflare-release/asset-manifest.json

      - name: Ensure isolated wiki auth storage
        if: steps.cloudflare_config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! wrangler r2 bucket list | grep -Fq "$CLOUDFLARE_WIKI_AUTH_BUCKET"; then
            wrangler r2 bucket create "$CLOUDFLARE_WIKI_AUTH_BUCKET" --location apac
          fi

      - name: Migrate fixed role accounts once and preserve later password changes
        id: wiki_auth_migration
        if: steps.cloudflare_config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          seed_dir=$(mktemp -d)
          trap 'rm -rf -- "$seed_dir"' EXIT
          node scripts/seed_wiki_auth.mjs --output "$seed_dir"
          migrated_roles=""
          pepper_remote="$seed_dir/remote-pepper.json"
          if wrangler r2 object get "$CLOUDFLARE_WIKI_AUTH_BUCKET/metadata/pepper.json" --remote --file "$pepper_remote" >/dev/null 2>&1; then
            if ! cmp --silent "$seed_dir/pepper.json" "$pepper_remote"; then
              echo "Wiki auth pepper differs from the initialized store; refusing a credential-breaking rotation." >&2
              exit 1
            fi
          else
            wrangler r2 object put "$CLOUDFLARE_WIKI_AUTH_BUCKET/metadata/pepper.json" \
              --remote \
              --content-type application/json \
              --file "$seed_dir/pepper.json"
          fi
          for role in planner developer; do
            remote_file="$seed_dir/remote-$role.json"
            if wrangler r2 object get "$CLOUDFLARE_WIKI_AUTH_BUCKET/users/$role.json" --remote --file "$remote_file" >/dev/null 2>&1; then
              remote_revision=$(node -e '
                const fs = require("node:fs");
                const record = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const revision = Number(record.bootstrap_revision || 0);
                process.stdout.write(String(Number.isSafeInteger(revision) && revision >= 0 ? revision : 0));
              ' "$remote_file")
              if [ "$remote_revision" -lt "$WIKI_AUTH_BOOTSTRAP_REVISION" ]; then
                wrangler r2 object put "$CLOUDFLARE_WIKI_AUTH_BUCKET/users/$role.json" \
                  --remote \
                  --content-type application/json \
                  --file "$seed_dir/$role.json"
                echo "Wiki $role account migrated to fixed ID and bootstrap revision $WIKI_AUTH_BOOTSTRAP_REVISION."
                migrated_roles="${migrated_roles:+$migrated_roles,}$role"
              else
                echo "Wiki $role account already uses bootstrap revision $remote_revision; preserving its password."
              fi
            else
              wrangler r2 object put "$CLOUDFLARE_WIKI_AUTH_BUCKET/users/$role.json" \
                --remote \
                --content-type application/json \
                --file "$seed_dir/$role.json"
              migrated_roles="${migrated_roles:+$migrated_roles,}$role"
            fi
          done
          echo "migrated_roles=$migrated_roles" >> "$GITHUB_OUTPUT"

      - name: Configure wiki auth server secret
        if: steps.cloudflare_config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SFH_WIKI_AUTH_PEPPER" \
            | wrangler pages secret put AUTH_PEPPER --project-name=sfh-dev-wiki

      - name: Switch game Worker to verified commit
        id: game_promotion
        if: steps.cloudflare_config.outputs.ready == 'true' && needs.plan.outputs.game == 'true'
        run: |
          wrangler deploy --config cloudflare/wrangler.jsonc \
            --var "RELEASE_PREFIX:game/releases/$GITHUB_SHA" \
            --var "DOWNLOAD_PREFIX:$R2_DOWNLOAD_PREFIX/releases/$GITHUB_SHA" \
            --var "RELEASE_VERSION:$RELEASE_VERSION" \
            --var "BUILD_COMMIT:$GITHUB_SHA"

      - name: Direct Upload verified wiki
        if: steps.cloudflare_config.outputs.ready == 'true'
        run: |
          cp cloudflare/wiki-auth/wrangler.jsonc .cloudflare-wiki/wrangler.jsonc
          (
            cd .cloudflare-wiki
            wrangler pages deploy \
              --branch=main \
              --commit-hash="$GITHUB_SHA" \
              --commit-dirty=false
          )

      - name: Verify Cloudflare wiki, game, range, and download
        id: release_e2e
        if: steps.cloudflare_config.outputs.ready == 'true'
        run: |
          for attempt in $(seq 1 24); do
            if curl --silent --show-error --fail "$CLOUDFLARE_WIKI_URL/" --output /tmp/wiki.html \
              && grep -q 'SFH' /tmp/wiki.html \
              && grep -q "name=\"sfh-build-commit\" content=\"$GITHUB_SHA\"" /tmp/wiki.html \
              && curl --silent --show-error --fail "$CLOUDFLARE_GAME_URL/healthz" --output /tmp/health.json \
              && grep -q "$GAME_BUILD_COMMIT" /tmp/health.json; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Cloudflare deployment did not become healthy in time" >&2
              exit 1
            fi
            sleep 5
          done
          game_status=$(curl --silent --show-error --dump-header /tmp/game.headers \
            --output /tmp/game.html --write-out '%{http_code}' "$CLOUDFLARE_GAME_URL/")
          test "$game_status" = "200"
          ! grep -qi '^content-range:' /tmp/game.headers
          for attempt in $(seq 1 24); do
            if SFH_WIKI_AUTH_E2E_BOOTSTRAP_ROLES="${{ steps.wiki_auth_migration.outputs.migrated_roles }}" \
              node scripts/test_wiki_auth_deployment.mjs "$CLOUDFLARE_WIKI_URL"; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Cloudflare wiki auth routing did not converge in time" >&2
              exit 1
            fi
            echo "Waiting for Cloudflare Pages Worker routing propagation ($attempt/24)"
            sleep 5
          done
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/game.headers
          grep -qi '^cross-origin-embedder-policy: require-corp' /tmp/game.headers
          range_status=$(curl --silent --show-error --output /tmp/wasm.range --write-out '%{http_code}' \
            --header 'Range: bytes=0-31' "$CLOUDFLARE_GAME_URL/index.wasm")
          test "$range_status" = "206"
          test "$(wc -c < /tmp/wasm.range)" -eq 32
          archive="SFH-Windows-x64-${RELEASE_VERSION}.zip"
          download_base="$CLOUDFLARE_GAME_URL/downloads/${RELEASE_VERSION}"
          download_status=$(curl --silent --show-error --output "/tmp/$archive" \
            --write-out '%{http_code}' "$download_base/$archive")
          test "$download_status" = "200"
          curl --silent --show-error --fail "$download_base/$archive.sha256" --output "/tmp/$archive.sha256"
          (cd /tmp && sha256sum --check "$archive.sha256")
          python3 -c 'import json, os, zipfile; archive="/tmp/SFH-Windows-x64-"+os.environ["RELEASE_VERSION"]+".zip"; metadata=json.loads(zipfile.ZipFile(archive).read("BUILD-METADATA.json")); assert metadata["build_commit"] == os.environ["GAME_BUILD_COMMIT"]; assert metadata["release_version"] == os.environ["RELEASE_VERSION"]'
          echo "CLOUDFLARE_E2E_OK wiki game range download commit=$GAME_BUILD_COMMIT wiki_commit=$GITHUB_SHA"

      - name: Restore previous game if published verification fails
        if: ${{ failure() && steps.game_promotion.outcome == 'success' && (steps.release_e2e.outcome == 'failure' || steps.release_e2e.outcome == 'skipped') }}
        run: |
          wrangler deploy --config cloudflare/wrangler.jsonc \
            --var "RELEASE_PREFIX:game/releases/$PREVIOUS_GAME_COMMIT" \
            --var "DOWNLOAD_PREFIX:$PREVIOUS_DOWNLOAD_PREFIX" \
            --var "RELEASE_VERSION:$PREVIOUS_RELEASE_VERSION" \
            --var "BUILD_COMMIT:$PREVIOUS_GAME_COMMIT"
          curl --silent --show-error --fail "$CLOUDFLARE_GAME_URL/healthz" | grep -q "$PREVIOUS_GAME_COMMIT"
          echo "GAME_ROLLBACK_OK previous=$PREVIOUS_GAME_COMMIT; workflow remains failed"

      - name: Remove superseded Windows downloads from R2
        if: steps.cloudflare_config.outputs.ready == 'true' && needs.plan.outputs.game == 'true'
        run: |
          legacy_args=()
          if [ "$PREVIOUS_DOWNLOAD_PREFIX" = "downloads" ]; then
            legacy_args=(--keep-legacy-version "$PREVIOUS_RELEASE_VERSION")
          fi
          python3 scripts/prune_windows_releases.py \
            --r2 \
            --bucket "$CLOUDFLARE_R2_BUCKET" \
            --prefix "$R2_DOWNLOAD_PREFIX/" \
            --keep-commit "$GITHUB_SHA" \
            --keep-commit "$PREVIOUS_GAME_COMMIT" "${legacy_args[@]}"

      - name: Create immutable-name verified backup branch
        if: steps.cloudflare_config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup_branch="backup/verified-main/$GITHUB_SHA"
          backup_ref="refs/heads/$backup_branch"
          git check-ref-format "$backup_ref"
          existing_sha=$(git ls-remote --heads origin "$backup_ref" | awk '{print $1}')
          if [ -n "$existing_sha" ]; then
            test "$existing_sha" = "$GITHUB_SHA"
            echo "VERIFIED_MAIN_BACKUP_EXISTS branch=$backup_branch commit=$GITHUB_SHA"
            exit 0
          fi
          git push origin "$GITHUB_SHA:$backup_ref"
          echo "VERIFIED_MAIN_BACKUP_CREATED branch=$backup_branch commit=$GITHUB_SHA"

  clean-transfer:
    # No permanent build archive on GitHub or WSL. An interrupted host can leave
    # this exact run directory behind; rerun ALL jobs, never reuse another run.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, sfh-build]
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [plan, export-game, e2e, package-windows, build, cloudflare-deploy]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Remove only this run's temporary handoff
        run: python3 scripts/ci_transfer.py clean
