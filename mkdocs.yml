site_name: SFH 개발 위키
site_description: Godot 4 기반 모듈형 탑다운 뱀서라이크 개발 문서
site_url: https://aedws.github.io/SFH/
site_dir: .wiki-site
repo_url: https://github.com/aedws/SFH
repo_name: aedws/SFH
edit_uri: edit/main/docs/

theme:
  name: material
  language: ko
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 전환
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 전환
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 홈: index.md
  - 개발 현황과 업데이트: development-status.md
  - 시작하기:
      - getting-started/index.md
      - 설치: getting-started/install.md
      - 편집기 기초: getting-started/editor-basics.md
      - 프로젝트 실행: getting-started/run-project.md
      - 웹에서 위키 수정: getting-started/edit-wiki-online.md
  - 게임 설계:
      - design/index.md
      - 게임 개요: design/game-overview.md
      - MVP 범위: design/mvp-scope.md
  - 아키텍처:
      - architecture/index.md
      - 모듈 규칙: architecture/module-rules.md
      - 모듈화 점검 기록: architecture/module-audit.md
      - 장면 트리: architecture/scene-tree.md
      - Signal 규칙: architecture/signals.md
  - 기능:
      - features/index.md
      - 랜덤 맵 생성: features/map-generation.md
      - 전장의 안개: features/fog-of-war.md
      - 전술 미니맵: features/minimap.md
      - 작전 선택과 탈출: features/raid-setup-extraction.md
      - 크레딧 파밍과 회수: features/credit-loot.md
      - 플레이어: features/player.md
      - 부분 체력 회복: features/health-recovery.md
      - 캐릭터 장비와 로드아웃: features/character-equipment.md
      - 격자 가방 인벤토리: features/grid-inventory.md
      - 장비 파츠·모듈 개조: features/equipment-customization.md
      - 모듈·고유 파츠 강화 경제: features/equipment-upgrade-economy.md
      - 적과 증원형 생성 시스템: features/enemies.md
      - 적 체력과 방어력: features/enemy-defense.md
      - 자동 무기: features/weapons.md
      - Q 무기 교체와 Google Sheets 밸런스: features/weapon-balance.md
      - 내부·외부 로그라이크 성장: features/progression.md
      - 게임 루프와 HUD: features/game-loop.md
  - 문제 해결:
      - troubleshooting/index.md
  - 결정 기록:
      - decisions/index.md
      - 0001 기술 스택: decisions/0001-technology-stack.md
