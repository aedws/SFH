site_name: SFH 개발 위키
site_description: Godot 4 기반 모듈형 탑다운 뱀서라이크 개발 문서
site_url: https://sfh-dev-wiki.pages.dev/
site_dir: .wiki-site

theme:
  name: material
  language: ko
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 전환
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 전환
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/search-dashboard.js
  - javascripts/play-entry.js
  - javascripts/knowledge-map.js
  - javascripts/planner-requests.js

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 홈: index.md
  - 개발 현황과 업데이트: development-status.md
  - 시작하기:
      - getting-started/index.md
      - 설치: getting-started/install.md
      - 편집기 기초: getting-started/editor-basics.md
      - 프로젝트 실행: getting-started/run-project.md
      - 웹에서 위키 수정: getting-started/edit-wiki-online.md
      - 위키 실시간 검색: getting-started/search-wiki.md
  - 게임 설계:
      - design/index.md
      - Master GDD 구현 대조: design/master-gdd-alignment.md
      - 현행 마일스톤 작업 라인: design/current-milestone-workline.md
      - 기획 요청·밸런스 데이터 운영: design/planner-request-workflow.md
      - AI 개발자·기획자 위키 협업 개선안: design/wiki-collaboration-workflow.md
      - 게임 개요: design/game-overview.md
      - MVP 범위: design/mvp-scope.md
      - 사이버펑크 비주얼 테마: design/cyberpunk-visual-theme.md
  - 아키텍처:
      - architecture/index.md
      - 모듈 규칙: architecture/module-rules.md
      - 모듈화 점검 기록: architecture/module-audit.md
      - 외부 에셋 라이선스 원장: architecture/third-party-assets.md
      - 장면 트리: architecture/scene-tree.md
      - Signal 규칙: architecture/signals.md
  - 성능:
      - 최소·권장 사양과 성능 예산: performance/minimum-requirements.md
  - 품질 검수:
      - 실제 플레이 세션 E2E: quality/e2e-play-session.md
      - 플레이어 인식 단위 E2E 감사: quality/player-perception-audit.md
      - 모바일 위키 반응형 E2E: quality/wiki-responsive-e2e.md
  - 기능:
      - features/index.md
      - 현장 무기 즉시 장착: features/field-loot-immediate-equip.md
      - 랜덤 맵 생성: features/map-generation.md
      - 전장의 안개: features/fog-of-war.md
      - 전술 미니맵: features/minimap.md
      - 작전 선택과 탈출: features/raid-setup-extraction.md
      - 탈출 방어전과 결과 정산: features/extraction-defense-results.md
      - 투입 비용·지역·난이도 계약: features/operation-contracts.md
      - 시작 거점과 전투 세션 전환: features/start-hub.md
      - 영구 해금·상점·창고·소모품: features/hub-economy.md
      - 크레딧 파밍과 회수: features/credit-loot.md
      - 전리품 생명 주기: features/loot-lifecycle.md
      - 지역·난이도 전리품 테이블: features/loot-tables.md
      - 현장 전리품 비교·획득: features/field-loot-acquisition.md
      - 플레이어: features/player.md
      - K 입력 설정과 자유 스킬 배치: features/key-mapping.md
      - 부분 체력 회복: features/health-recovery.md
      - 전투 스킬과 쿨타임 HUD: features/combat-skills.md
      - 타격감과 피격 피드백: features/hit-feedback.md
      - 전투 에너지·충전·회복 드랍: features/combat-resources.md
      - 스마트 자동 타게팅: features/smart-targeting.md
      - 도면 제작과 랜덤 옵션: features/blueprint-crafting.md
      - 페널티 변형과 조건부 랭킹: features/penalty-ranking.md
      - 캐릭터 장비와 로드아웃: features/character-equipment.md
      - 격자 가방 인벤토리: features/grid-inventory.md
      - 장비 파츠·모듈 개조: features/equipment-customization.md
      - 모듈·고유 파츠 강화 경제: features/equipment-upgrade-economy.md
      - 적과 증원형 생성 시스템: features/enemies.md
      - 방 진입 전투와 봉쇄 보상: features/room-encounters.md
      - 적 체력과 방어력: features/enemy-defense.md
      - 자동 무기: features/weapons.md
      - Q 무기 교체와 Google Sheets 밸런스: features/weapon-balance.md
      - 내부 성장·장비 강화 Google Sheets 연동: features/growth-balance.md
      - 내부·외부 로그라이크 성장: features/progression.md
      - 게임 루프와 HUD: features/game-loop.md
  - 문제 해결:
      - troubleshooting/index.md
  - 결정 기록:
      - decisions/index.md
      - 0001 기술 스택: decisions/0001-technology-stack.md
