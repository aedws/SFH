site_name: SFH 개발 위키
site_description: SFH 공개 플레이 테스트와 인증된 기획·개발 작업 공간
site_url: https://sfh-dev-wiki.pages.dev/
site_dir: .wiki-site

theme:
  name: material
  language: ko
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 전환
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 전환
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

extra:
  generator: false

hooks:
  - scripts/wiki_articles.py

extra_css:
  - stylesheets/extra.css
  - stylesheets/articles.css
  - stylesheets/header-actions.css
  - stylesheets/dps-lab.css
  - stylesheets/role-workspace.css

extra_javascript:
  - javascripts/search-dashboard.js
  - javascripts/play-entry.js
  - javascripts/knowledge-map.js
  - javascripts/code-module-map.js
  - javascripts/owner-decision-console.js
  - javascripts/planner-requests.js
  - javascripts/planner-proposal.js
  - javascripts/role-auth.js
  - javascripts/dps-engine.js
  - javascripts/dps-lab.js
  - javascripts/balance-engine.js
  - javascripts/balance-workbench.js
  - javascripts/role-workspace.js

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 공개 플레이 홈: index.md
  - SFH 문서:
      - SFH 종합 문서: features/index.md
      - 작전과 맵:
          - 작전과 맵: features/operations.md
          - 시작 거점과 전투 세션 전환: features/start-hub.md
          - 작전 진입 마법사와 첫 투입 안내: features/operation-entry-wizard.md
          - 투입 비용·지역·난이도 계약: features/operation-contracts.md
          - 작전 선택과 탈출: features/raid-setup-extraction.md
          - 랜덤 맵 생성: features/map-generation.md
          - 익스트랙션 구역과 공간 공개: features/extraction-district.md
          - 전장의 안개: features/fog-of-war.md
          - 전술 미니맵: features/minimap.md
          - 탈출 방어전과 결과 정산: features/extraction-defense-results.md
          - 게임 루프와 HUD: features/game-loop.md
          - 작전 투입 사전검증과 불변 계획: features/operation-launch-preflight.md
      - 전투와 조작:
          - 전투와 조작: features/combat.md
          - 플레이어: features/player.md
          - K 입력 설정과 자유 스킬 배치: features/key-mapping.md
          - 모바일 키패드와 HUD 표시 설정: features/mobile-hud-settings.md
          - 자동 무기: features/weapons.md
          - 스마트 자동 타게팅: features/smart-targeting.md
          - 전투 스킬과 쿨타임 HUD: features/combat-skills.md
          - 전투 에너지·충전·회복 드랍: features/combat-resources.md
          - 부분 체력 회복: features/health-recovery.md
          - 타격감과 피격 피드백: features/hit-feedback.md
          - 적과 증원형 생성 시스템: features/enemies.md
          - 적 체력과 방어력: features/enemy-defense.md
          - 투입액 50% 회수 추격 보스: features/elite-pursuit.md
          - 방 진입 전투와 봉쇄 보상: features/room-encounters.md
      - 장비와 인벤토리:
          - 장비와 인벤토리: features/equipment.md
